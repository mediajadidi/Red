# ==========================================================================
#  wrangler.toml — نسخهٔ نهایی و کامل (همون تنظیمات قبلی‌تان + KV + Cron)
#  فقط کافی‌ست مقدار id را در بخش kv_namespaces با خروجی واقعی دستور زیر
#  جایگزین کنید؛ بقیه را همین‌طور که هست کپی/پیست کنید.
#
#    wrangler kv namespace create LEAGUES_KV
#
#  خروجی آن دستور چیزی شبیه این می‌دهد:
#    [[kv_namespaces]]
#    binding = "LEAGUES_KV"
#    id = "abcd1234ef567890...."
#  فقط رشتهٔ id را از خروجی واقعی خودتان کپی کرده و پایین جایگزین کنید.
# ==========================================================================

name = "livescore-api-gateway"
main = "worker.js"
compatibility_date = "2026-01-01"

# متغیرهای عمومی (غیرمحرمانه). CORS را با دامنهٔ سایت اصلی‌تان محدود کنید؛
# اگر خالی/"*" بماند، همه می‌توانند به ورکر شما فراخوانی بزنند.
[vars]
ALLOWED_ORIGIN = "https://example.com"
# برای چند دامنه، با کاما جدا کنید:
# ALLOWED_ORIGIN = "https://example.com,https://www.example.com"

# ------------------------------------------------------------------------
# KV Namespace برای ذخیرهٔ فهرست کامل کشورها/لیگ‌ها/تورنمنت‌ها.
# بدون این بخش، ورکر همچنان کار می‌کند ولی فهرست لیگ‌ها/تورنمنت‌ها فقط
# «جزئی» (حدود ۴۰ کشور اول) خواهد بود، نه کامل.
# ------------------------------------------------------------------------
[[kv_namespaces]]
binding = "LEAGUES_KV"
id = "9302a7d6c26f4fc090edf9dc8eb0271a"

# ------------------------------------------------------------------------
# Cron Trigger: هر تیک فقط یک Batch از کشورها را جارو می‌کند (به‌خاطر سقف
# ۵۰ ساب‌ریکوئستِ پلن رایگان Workers). هر ۲۰ دقیقه پیشنهاد می‌شود.
# ------------------------------------------------------------------------
[triggers]
crons = ["*/20 * * * *"]

# ------------------------------------------------------------------------
# کلیدهای محرمانه (Secrets) — اینجا نوشته نمی‌شوند، بلکه با دستور زیر
# مستقیماً در Cloudflare ثبت می‌شوند و در این فایل ذخیره نمی‌مانند.
# اگر قبلاً یک‌بار زده‌اید، نیازی به تکرار نیست:
#
#   wrangler secret put API_FOOTBALL_KEY
#   wrangler secret put SCOREBAT_TOKEN
#
# سپس:
#   wrangler deploy
#
# بررسی وضعیت پیمایش فهرست کامل بعد از دپلوی:
#   https://<subdomain-شما>.workers.dev/api/health
#   (به فیلدهای hasLeaguesKV و catalog.hasSnapshot نگاه کنید)
# ------------------------------------------------------------------------
