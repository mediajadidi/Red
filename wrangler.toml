# wrangler.toml — دروازهٔ امن apifootball
#
# نام ورکر باید با ساب‌دامین فعلی‌تان یکی باشد تا آدرس عوض نشود:
#   https://red.chat-ajsports.workers.dev/api   →   name = "red"
# اگر ورکر قبلی‌تان اسم دیگری دارد، فقط همین مقدار را عوض کنید.
name = "red"
main = "worker.js"
compatibility_date = "2025-01-01"

# آدرس workers.dev فعال بماند
workers_dev = true

[vars]
# اختیاری: محدودکردن CORS به دامنه‌های خودتان (چند دامنه با کاما جدا شود).
# اگر خالی بماند، همهٔ دامنه‌ها مجازند.
# مثال: ALLOWED_ORIGINS = "https://ajsports.dpdns.org,https://www.ajsports.dpdns.org"
ALLOWED_ORIGINS = ""

[observability]
enabled = true

# ⚠️ کلید API را اینجا ننویسید. با این دستور امن ثبت می‌شود:
#   npx wrangler secret put APIFOOTBALL_KEY
#
# استقرار:
#   npx wrangler deploy
