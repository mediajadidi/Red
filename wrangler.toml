# ==========================================================================
#  wrangler.toml — نسخهٔ اصلی (مطابق ورکر قبلی، بدون KV و بدون Cron)
#  این فایل را با تنظیمات واقعی پروژه‌تان (name, compatibility_date و ...)
#  جایگزین/تکمیل کنید؛ مقادیر زیر فقط نمونه‌اند.
# ==========================================================================

name = "livescore-api-gateway"
main = "worker.js"
compatibility_date = "2026-01-01"

# متغیرهای عمومی (غیرمحرمانه). CORS را با دامنهٔ سایت اصلی‌تان محدود کنید؛
# اگر خالی/"*" بماند، همه می‌توانند به ورکر شما فراخوانی بزنند.
[vars]
ALLOWED_ORIGIN = "https://example.com"
# برای چند دامنه، با کاما جدا کنید:
# ALLOWED_ORIGIN = "https://example.com,https://www.example.com"

# ------------------------------------------------------------------------
# کلیدهای محرمانه (Secrets) — اینجا نوشته نمی‌شوند، بلکه با دستور زیر
# مستقیماً در Cloudflare ثبت می‌شوند و در این فایل ذخیره نمی‌مانند:
#
#   wrangler secret put API_FOOTBALL_KEY
#   wrangler secret put SCOREBAT_TOKEN
#
# سپس:
#   wrangler deploy
# ------------------------------------------------------------------------

